name: linnms

services:
  app:
    image: ghcr.io/ramonveredic/nms:latest
    container_name: linnms
    hostname: linnms
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
      - DB_SOCKET=/run/mysqld/mysqld.sock
      - DB_NAME=linnms_appliance
      - DB_USER=root
      - DB_PASSWORD=
    ports:
      - target: 80
        published: "84"
        protocol: tcp
      - target: 443
        published: "4143"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/linnms/state
        target: /config
      - type: bind
        source: /DATA/AppData/linnms/run
        target: /run/mysqld
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: linnms-db
    restart: unless-stopped
    command:
      - --skip-networking
      - --socket=/run/mysqld/mysqld.sock
    environment:
      - MARIADB_DATABASE=linnms_appliance
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1
      - MARIADB_AUTO_UPGRADE=1
      - TZ=Asia/Jakarta
    volumes:
      - type: bind
        source: /DATA/AppData/linnms/database
        target: /var/lib/mysql
      - type: bind
        source: /DATA/AppData/linnms/run
        target: /run/mysqld
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb --protocol=SOCKET --socket=/run/mysqld/mysqld.sock --user=root linnms_appliance --execute='SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

x-casaos:
  architectures:
    - amd64
    - arm64
  author: RamonVeredic
  category: Network
  description:
    en_us: LINNMS Production Appliance.
  developer: LINNMS
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/RamonVeredic/icon@main/LINNMS/LINNMS_icon.ico
  index: /
  is_uncontrolled: false
  main: app
  port_map: "84"
  scheme: http
  store_app_id: linnms
  tagline:
    en_us: Network Management System.
  title:
    custom: LINNMS
    en_us: LINNMS