<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Perpanjang layanan · LINNMS</title>
  <link rel="icon" type="image/x-icon" href="/assets/icon.ico">
  <link rel="stylesheet" href="/assets/icon/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/linnms-main.min.css">
  <link rel="stylesheet" href="/assets/css/page/login/login.css">
  <link rel="stylesheet" href="/assets/css/linnms-termplet.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card status-card">
      <div class="login-brand">
        <i class="brand-icon bi bi-boxes" aria-hidden="true"></i>
        <span class="brand-copy"><strong>LINNMS</strong><small>Network Management</small></span>
      </div>
      <div class="eyebrow">Layanan</>
      <h1>Masa layanan berakhir</h1>
      <p class="lead">Perpanjang layanan LINNMS agar dapat menggunakan aplikasi kembali.</p>
      <a class="button primary login-button" id="renewal-whatsapp" href="https://wa.me/">Perpanjang via WhatsApp</a>
    </section>
  </main>
  <script>
    (() => {
      const number = new URLSearchParams(location.search).get('wa') || '';
      if (/^[0-9]{8,16}$/.test(number)) {
        document.getElementById('renewal-whatsapp').href = 'https://wa.me/' + number;
      }
    })();
  </script>
</body>
</html>
