server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;

    server_name _;
    include /config/nginx/ssl.conf;

    root /config/www;
    index index.php;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /assets/icon.ico =404;
    }

    location = /404.html {
        try_files /404.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Templates and view helpers are included by PHP and never served directly.
    location = /view { return 404; }
    location ^~ /view/ { return 404; }
    location = /pages { return 404; }
    location ^~ /pages/ { return 404; }
    location = /layouts { return 404; }
    location ^~ /layouts/ { return 404; }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors on;
        fastcgi_hide_header X-Powered-By;
    }

    location = /live.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/live.php;
        fastcgi_param SCRIPT_NAME /live.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location = /data.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/data.php;
        fastcgi_param SCRIPT_NAME /data.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location = /internal-api.php {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/linnms/runtime/backend/api.php;
        fastcgi_param SCRIPT_NAME /internal-api.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location = /onu-list.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/onu-list.php;
        fastcgi_param SCRIPT_NAME /onu-list.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location = /connection-test.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/connection-test.php;
        fastcgi_param SCRIPT_NAME /connection-test.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location = /terminal.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/terminal.php;
        fastcgi_param SCRIPT_NAME /terminal.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file is public.
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }

    # Pretty routes: /login, /dashboard, /olt/... etc. all enter index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }
}
