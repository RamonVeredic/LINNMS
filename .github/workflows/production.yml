name: LINNMS
on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      source_mode:
        description: "Sumber master hasil merge atau tag rilis vX.Y.Z"
        type: choice
        required: true
        default: master
        options:
          - master
          - tag
      source_tag:
        description: "Tag rilis dari LINNMS-Staging/master, misalnya v1.3.0 (hanya mode tag)"
        required: false
        type: string
      publish:
        description: "successful build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: linnms-production-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release build recipes only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify LINNMS Release tag belongs to main
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Release tag format: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          release_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo 'Release tag must point to a commit reachable from LINNMS/main' >&2
            exit 1
          fi

      - name: Validate release version and source tag
        id: release
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version || 'v0.0.0') }}
          SOURCE_MODE: ${{ github.ref_type == 'tag' && 'tag' || (inputs.source_mode || 'master') }}
          SOURCE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.source_mode == 'tag' && inputs.source_tag || '') }}
          TAGGED_BUILD: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release version must be vMAJOR.MINOR.PATCH (for example v1.2.3)' >&2
            exit 1
          fi
          if [[ "$SOURCE_MODE" != 'master' && "$SOURCE_MODE" != 'tag' ]]; then
            echo 'Invalid source mode: expected master or tag' >&2
            exit 1
          fi
          if [[ "$SOURCE_MODE" == 'tag' && -z "$SOURCE_TAG" ]]; then
            echo 'source_mode=tag requires a staging source_tag' >&2
            exit 1
          fi
          if [[ "$SOURCE_MODE" == 'master' && -n "$SOURCE_TAG" ]]; then
            echo 'source_tag is only supported in tag mode' >&2
            exit 1
          fi
          if [[ -n "$SOURCE_TAG" ]]; then
            # Production tags use the promoted vX.Y.Z ref, never a staging-vX.Y.Z test ref.
            if [[ ! "$SOURCE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "${SOURCE_TAG:1}" != "${RELEASE_VERSION:1}" ]]; then
              echo 'Source must be a matching production vX.Y.Z tag from LINNMS-Staging/master' >&2
              exit 1
            fi
            if [[ "$TAGGED_BUILD" == "true" && "$SOURCE_TAG" != "$RELEASE_VERSION" ]]; then
              echo 'Automatic release tag must match the promoted source release tag' >&2
              exit 1
            fi
          fi
          echo "version=${RELEASE_VERSION:1}" >> "$GITHUB_OUTPUT"
          echo "source_mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Release filtering and plaintext rejection
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -v -s tests

      - name: Check required private-repository credentials
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
        run: |
          set -eu
          test -n "$READ_TOKEN" || { echo 'Missing LINNMS_READ_TOKEN' >&2; exit 1; }

      - name: Fetch promoted LINNMS-Staging source (master or vX.Y.Z tag)
        id: source
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
          SOURCE_MODE: ${{ steps.release.outputs.source_mode }}
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linnms-protected"
          mkdir -p "$work"
          git -c advice.detachedHead=false clone -q --depth 1 --branch master \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-Staging.git" "$work/staging"
          if [[ "$SOURCE_MODE" == "tag" ]]; then
            # Production uses the promoted vX.Y.Z tag (must be merged into master), not staging-vX.Y.Z.
            git -C "$work/staging" fetch -q --unshallow origin master
            git -C "$work/staging" fetch -q origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
            pinned_sha="$(git -C "$work/staging" rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}")"
            if ! git -C "$work/staging" merge-base --is-ancestor "$pinned_sha" origin/master; then
              echo 'Refusing release: source vX.Y.Z tag is not reachable from LINNMS-Staging/master' >&2
              exit 1
            fi
            git -C "$work/staging" checkout -q --detach "$pinned_sha"
          fi
          # Resolve the actual checked-out snapshot exactly once for build metadata.
          # Manual master releases do not require an SHA input.
          resolved_sha="$(git -C "$work/staging" rev-parse HEAD)"
          git -c advice.detachedHead=false clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-protection.git" "$work/protection"
          protection_sha="$(git -C "$work/protection" rev-parse HEAD)"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Source: LINNMS-Staging/${SOURCE_TAG:-master} commit $resolved_sha"
          echo "Protection commit: $protection_sha"
          {
            echo "### LINNMS Production build"
            printf -- "- LINNMS-Staging source ref: %s\n" "${SOURCE_TAG:-master}"
            printf -- "- Staging commit: %s\n" "$resolved_sha"
            printf -- "- Protection commit: %s\n" "$protection_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: smoke-test loader on AMD64/ARM64
        run: |
          set -eu
          cd "$RUNNER_TEMP/linnms-protected/protection"
          docker buildx build --platform linux/amd64 -f docker/Dockerfile.smoke .
          docker buildx build --platform linux/arm64 -f docker/Dockerfile.smoke .

      - name: Generate unique ephemeral encryption key per release
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          openssl rand -hex 32 > "$work/release.key"
          test "$(wc -c < "$work/release.key")" -eq 65
          chmod 600 "$work/release.key"

      - name: Filter PHP sources off-context
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          python3 scripts/filter_production.py "$work/staging" "$work/plain"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" php:8.5-cli-alpine sh -euc '
              find /work/plain/config -type f -name "*.php" -print0 |
              xargs -0 -r -n 1 php -l >/dev/null
            '
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            -e LINNMS_PROTECTION_KEY_FILE=/work/release.key \
            php:8.5-cli-alpine php /work/protection/encoder/encode.php \
            /work/plain /work/encoded config/app/runtime/vendor
          rm -rf "$work/plain"
          mkdir -p "$work/context/bundle" "$work/context/protection"
          cp -a "$work/encoded/." "$work/context/bundle/"
          cp -a "$work/protection/loader" "$work/context/protection/"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            php:8.5-cli-alpine php /work/protection/encoder/generate_header.php \
            /work/release.key /work/context/protection/loader/linnms_auto_key.h
          cp docker/Dockerfile.production "$work/context/Dockerfile"
          python3 scripts/verify_context.py "$work/context"
          rm -f "$work/release.key"
          rm -rf "$work/encoded"

      - name: Build (no push unless publish explicitly enabled)
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          tags: ghcr.io/ramonveredic/linnms:${{ steps.release.outputs.version }}-candidate

      - name: GHCR authentication
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish protected image (explicit opt-in only)
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          tags: |
            ghcr.io/ramonveredic/linnms:latest
            ghcr.io/ramonveredic/linnms:${{ steps.release.outputs.version }}
