name: LINNMS Protected Production

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
    paths:
      - '.github/workflows/production.yml'
      - 'docker/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Production release tag (e.g. v1.2.3)"
        required: true
        type: string
      source_tag:
        description: "Optional immutable source tag from LINNMS-Staging (e.g. v1.2.3)"
        required: false
        type: string
      source_sha:
        description: "Expected commit SHA for source_tag (sent by staging dispatcher)"
        required: false
        type: string
      publish:
        description: "Push both GHCR tags (latest and version) after successful build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: linnms-production-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production build recipes only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify LINNMS production tag belongs to main
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production tag format: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'Production tag must point to a commit reachable from LINNMS/main' >&2
            exit 1
          fi

      - name: Validate release version and source tag
        id: release
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version || 'v0.0.0') }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
          TAGGED_BUILD: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release version must be vMAJOR.MINOR.PATCH (for example v1.2.3)' >&2
            exit 1
          fi
          if [[ -n "$SOURCE_TAG" ]]; then
            if [[ ! "$SOURCE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "v${SOURCE_TAG:1}" != "$RELEASE_VERSION" ]]; then
              echo 'Source tag must match release version (case-insensitive V)' >&2
              exit 1
            fi
          fi
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Invalid 40-character source commit SHA' >&2
            exit 1
          fi
          if [[ -n "$SOURCE_SHA" && -z "$SOURCE_TAG" ]]; then
            echo 'source_sha requires source_tag' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" && -z "$SOURCE_TAG" && "$TAGGED_BUILD" != "true" ]]; then
            echo 'Manual publishing requires an immutable staging source_tag' >&2
            exit 1
          fi
          echo "version=${RELEASE_VERSION:1}" >> "$GITHUB_OUTPUT"

      - name: Check required private-repository credentials
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
        run: |
          set -eu
          test -n "$READ_TOKEN" || { echo 'Missing LINNMS_READ_TOKEN' >&2; exit 1; }

      - name: Fetch protected source from the exact staging release tag
        id: source
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linnms-protected"
          mkdir -p "$work"
          git -c advice.detachedHead=false clone -q --depth 1 --branch master \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-Staging.git" "$work/staging"
          if [[ -n "$SOURCE_TAG" ]]; then
            # Verify the tag resolves to the requested commit AND belongs to master.
            # Never compile newer master files during a tagged release.
            git -C "$work/staging" fetch -q --unshallow origin master
            git -C "$work/staging" fetch -q origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
            pinned_sha="$(git -C "$work/staging" rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}")"
            if [[ -n "$SOURCE_SHA" && "$pinned_sha" != "$SOURCE_SHA" ]]; then
              echo 'Staging source tag moved or SHA does not match dispatch' >&2
              exit 1
            fi
            if ! git -C "$work/staging" merge-base --is-ancestor "$pinned_sha" origin/master; then
              echo 'Refusing release: staging tag is not reachable from master' >&2
              exit 1
            fi
            git -C "$work/staging" checkout -q --detach "$pinned_sha"
          fi
          git -c advice.detachedHead=false clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-protection.git" "$work/protection"
          resolved_sha="$(git -C "$work/staging" rev-parse HEAD)"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Source commit: $resolved_sha"
          echo "Protection commit: $(git -C "$work/protection" rev-parse HEAD)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test native loader on AMD64/ARM64
        run: |
          set -eu
          cd "$RUNNER_TEMP/linnms-protected/protection"
          docker buildx build --platform linux/amd64 -f docker/Dockerfile.smoke .
          docker buildx build --platform linux/arm64 -f docker/Dockerfile.smoke .

      - name: Generate unique ephemeral encryption key per release
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          openssl rand -hex 32 > "$work/release.key"
          test "$(wc -c < "$work/release.key")" -eq 65
          chmod 600 "$work/release.key"

      - name: Filter and encrypt all PHP sources off-context
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          python3 scripts/filter_production.py "$work/staging" "$work/plain"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            -e LINNMS_PROTECTION_KEY_FILE=/work/release.key \
            php:8.5-cli-alpine php /work/protection/encoder/encode.php \
            /work/plain /work/encoded
          rm -rf "$work/plain"
          mkdir -p "$work/context/bundle" "$work/context/protection"
          cp -a "$work/encoded/." "$work/context/bundle/"
          cp -a "$work/protection/loader" "$work/context/protection/"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            php:8.5-cli-alpine php /work/protection/encoder/generate_header.php \
            /work/release.key /work/context/protection/loader/linnms_auto_key.h
          cp docker/Dockerfile.production "$work/context/Dockerfile"
          python3 scripts/verify_context.py "$work/context"
          rm -f "$work/release.key"
          rm -rf "$work/encoded"

      - name: Build (no push unless publish explicitly enabled)
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          tags: ghcr.io/ramonveredic/nms:${{ steps.release.outputs.version }}-candidate

      - name: GHCR authentication
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish protected image (explicit opt-in only)
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          tags: |
            ghcr.io/ramonveredic/nms:latest
            ghcr.io/ramonveredic/nms:${{ steps.release.outputs.version }}
