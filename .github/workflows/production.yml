name: LINNMS Protected Production

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to GHCR only after validating full runtime in your environment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production build recipes only
        uses: actions/checkout@v4

      - name: Check required private-repository credentials
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
        run: |
          set -eu
          test -n "$READ_TOKEN" || { echo 'Missing LINNMS_READ_TOKEN' >&2; exit 1; }

      - name: Fetch source and protection from private repositories
        env:
          READ_TOKEN: ${{ secrets.LINNMS_READ_TOKEN }}
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          mkdir -p "$work"
          git -c advice.detachedHead=false clone -q --depth 1 --branch master \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-Staging.git" "$work/staging"
          git -c advice.detachedHead=false clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/RamonVeredic/LINNMS-protection.git" "$work/protection"
          echo "Source commit: $(git -C "$work/staging" rev-parse HEAD)"
          echo "Protection commit: $(git -C "$work/protection" rev-parse HEAD)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test native loader on AMD64/ARM64
        run: |
          set -eu
          cd "$RUNNER_TEMP/linnms-protected/protection"
          docker buildx build --platform linux/amd64 -f docker/Dockerfile.smoke .
          docker buildx build --platform linux/arm64 -f docker/Dockerfile.smoke .

      - name: Generate unique ephemeral encryption key per release
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          openssl rand -hex 32 > "$work/release.key"
          test "$(wc -c < "$work/release.key")" -eq 65
          chmod 600 "$work/release.key"

      - name: Filter and encrypt all PHP sources off-context
        run: |
          set -eu
          work="$RUNNER_TEMP/linnms-protected"
          umask 077
          python3 scripts/filter_production.py "$work/staging" "$work/plain"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            -e LINNMS_PROTECTION_KEY_FILE=/work/release.key \
            php:8.5-cli-alpine php /work/protection/encoder/encode.php \
            /work/plain /work/encoded
          rm -rf "$work/plain"
          mkdir -p "$work/context/bundle" "$work/context/protection"
          cp -a "$work/encoded/." "$work/context/bundle/"
          cp -a "$work/protection/loader" "$work/context/protection/"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$work:/work" \
            php:8.5-cli-alpine php /work/protection/encoder/generate_header.php \
            /work/release.key /work/context/protection/loader/linnms_auto_key.h
          cp docker/Dockerfile.production "$work/context/Dockerfile"
          python3 scripts/verify_context.py "$work/context"
          rm -f "$work/release.key"
          rm -rf "$work/encoded"

      - name: Build (no push unless publish explicitly enabled)
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/ramonveredic/nms:candidate

      - name: GHCR authentication
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish protected image (explicit opt-in only)
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/linnms-protected/context
          file: ${{ runner.temp }}/linnms-protected/context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ramonveredic/nms:protected-candidate
          cache-to: type=gha,mode=min
